<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Our Team</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div id="navbar-placeholder"></div>
<script>
  fetch("navbar.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("navbar-placeholder").innerHTML = data;
    });
</script>
<div class="container py-5">
  <h1 class="text-center mb-5">Meet the Team</h1>
  <div class="row g-4">
    <div class="col-sm-6 col-md-4 col-lg-3">
      <div class="card">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Person 1">
        <div class="card-body text-center">
          <h5 class="card-title">Jane Doe</h5>
          <p class="card-text">Team Lead, AI Research</p>
          <a href="mailto:jane@example.com" class="btn btn-outline-primary btn-sm">Email</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
